services:
  # Backend API: Django Ninja
  - type: web
    name: afriqan-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: backend
    plan: starter
    region: oregon
    healthCheckPath: /api/shop/products
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: afriqan-postgres
          property: connectionString
      - key: MPESA_ENVIRONMENT
        value: "production"
      - key: MPESA_CONSUMER_KEY
        value: "NbAHKYCDTxr29yIxWyRjHLbGBD21JLHlE3AHqzS3umr0egYc"
      - key: MPESA_CONSUMER_SECRET
        value: "Gy5Rp08dwx7l43SzahIhLADvziYw1sDyR5nSYrLeVCdK5FIqMlHETQ2raDi6pK84"
      - key: MPESA_PASSKEY
        value: "ea8dad6511bed9c3aebbbd73689fc66ec4ed156f2a0d3aa15794658c9f62377d"
      - key: MPESA_SHORTCODE
        value: "5008412"
      - key: MPESA_TILL_NUMBER
        value: "4466556"
      - key: MPESA_TRANSACTION_TYPE
        value: "CustomerBuyGoodsOnline"
      - key: MPESA_CALLBACK_URL
        fromService:
          type: web
          name: afriqan-backend
          envVarKey: RENDER_EXTERNAL_URL
          transformation: "${RENDER_EXTERNAL_URL}/api/shop/payments/mpesa/callback"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_EMAIL
        value: "admin@afriqan.co.ke"
      - key: ADMIN_PASSWORD
        value: "AfriqanAdmin2026!"

  # Frontend: Next.js
  - type: web
    name: afriqan-frontend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: frontend
    plan: starter
    region: oregon
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: afriqan-backend
          envVarKey: RENDER_EXTERNAL_URL
          transformation: "${RENDER_EXTERNAL_URL}/api/shop"
      - key: NODE_ENV
        value: production

databases:
  # Managed PostgreSQL Database
  - name: afriqan-postgres
    plan: starter
    region: oregon
    databaseName: afriqan_db
    user: afriqan_user
